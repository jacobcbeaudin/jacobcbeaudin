<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 350" width="830" height="350" role="img" aria-label="A terminal session, three commands of the jcb CLI. jcb runs, newest first, each run with a bar proportional to its duration: run 04 Gametime 2023 to now, running, ml platform plus agentic harnesses; run 03 Rivian 2022-23, autonomy data platform; run 02 Mercedes-Benz R&amp;D 2019-22, sensor fusion plus fleet telemetry; run 01 aiPod at Idealab 2018, ml plus simulation at a startup studio. jcb whoami: name, jacob beaudin; role, senior machine learning engineer II; education, MS Analytics and BS Industrial Engineering, USC. jcb status: at work, machine learning model training and serving, software development lifecycle automation, and building agents for data and automation; own time, a notebook server in Rust. Commit 800617a: i build the ml &amp; ai stack end to end. Agent: jacob.beaudin. Status bar: jacob at prod, window 0:stack, uptime 8y.">
  <style>
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .t  { fill: #627a8c; }
    .k  { fill: #90a6b4; }
    .d  { fill: #c6d5de; }
    .ok { fill: #4cb3a4; }
    .ac { fill: #5fcdbf; }
    @media (prefers-reduced-motion: no-preference) {
      .ln { opacity: 0.35; animation: rise 0.4s ease-out forwards; }
      .live { animation: breathe 3.2s ease-in-out infinite; animation-delay: 2.6s; }
    }
    @keyframes rise { to { opacity: 1; } }
    @keyframes breathe { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>

  <rect x="0.5" y="0.5" width="829" height="349" rx="10" fill="#1e2a35"/>

  <!-- window chrome -->
  <path d="M10.5 0.5 H819.5 A10 10 0 0 1 829.5 10.5 V27 H0.5 V10.5 A10 10 0 0 1 10.5 0.5 Z" fill="#243240"/>
  <circle cx="22" cy="14" r="5" fill="#ff5f57"/>
  <path d="M19.9 11.9 L24.1 16.1 M24.1 11.9 L19.9 16.1" stroke="#8c2b23" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="38" cy="14" r="5" fill="#febc2e"/>
  <line x1="35.4" y1="14" x2="40.6" y2="14" stroke="#9a6b12" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="54" cy="14" r="5" fill="#28c840"/>
  <path d="M51.4 14.2 V11.6 H54 Z M56.6 13.8 V16.4 H53.2 Z" fill="#1c6f27"/>
  <text class="mono t" font-size="11" x="72" y="18">jacob@prod:~</text>
  <line x1="1" y1="27" x2="829" y2="27" stroke="#30404d" stroke-width="1"/>

  <!-- $ agent runs -->
  <g class="ln" style="animation-delay:0.10s">
    <text class="mono" font-size="12" y="48"><tspan x="32" class="ac">$</tspan><tspan x="48" class="d">jcb runs --newest-first</tspan></text>
  </g>
  <g class="ln" style="animation-delay:0.25s">
    <text class="mono" font-size="12.5" y="68"><tspan x="32" class="t">run/04</tspan><tspan x="94" class="ac live">&#9656;</tspan><tspan x="116" class="d" font-weight="600">Gametime</tspan><tspan x="330" class="k">2023-now</tspan><tspan x="478" class="d">ml platform + agentic harnesses</tspan></text>
    <rect class="ac" opacity="0.8" x="400" y="59.5" width="65" height="6" rx="3"/>
  </g>
  <g class="ln" style="animation-delay:0.40s">
    <text class="mono" font-size="12.5" y="86"><tspan x="32" class="t">run/03</tspan><tspan x="94" class="ok">&#10003;</tspan><tspan x="116" class="d" font-weight="600">Rivian</tspan><tspan x="330" class="k">2022-23</tspan><tspan x="478" class="d">autonomy data platform</tspan></text>
    <rect class="ok" opacity="0.5" x="400" y="77.5" width="18" height="6" rx="3"/>
  </g>
  <g class="ln" style="animation-delay:0.55s">
    <text class="mono" font-size="12.5" y="104"><tspan x="32" class="t">run/02</tspan><tspan x="94" class="ok">&#10003;</tspan><tspan x="116" class="d" font-weight="600">Mercedes-Benz R&amp;D</tspan><tspan x="330" class="k">2019-22</tspan><tspan x="478" class="d">sensor fusion + fleet telemetry</tspan></text>
    <rect class="ok" opacity="0.5" x="400" y="95.5" width="54" height="6" rx="3"/>
  </g>
  <g class="ln" style="animation-delay:0.70s">
    <text class="mono" font-size="12.5" y="122"><tspan x="32" class="t">run/01</tspan><tspan x="94" class="ok">&#10003;</tspan><tspan x="116" class="d" font-weight="600">aiPod (Idealab)</tspan><tspan x="330" class="k">2018</tspan><tspan x="478" class="d">ml + simulation at a startup studio</tspan></text>
    <rect class="ok" opacity="0.5" x="400" y="113.5" width="18" height="6" rx="3"/>
  </g>

  <!-- $ agent describe, newest first -->
  <g class="ln" style="animation-delay:0.95s">
    <text class="mono" font-size="12" y="150"><tspan x="32" class="ac">$</tspan><tspan x="48" class="d">jcb whoami</tspan></text>
  </g>
  <g class="ln" style="animation-delay:1.10s">
    <text class="mono" font-size="12" y="168"><tspan x="32" class="k">name</tspan><tspan x="116" class="d">jacob beaudin</tspan></text>
  </g>
  <g class="ln" style="animation-delay:1.25s">
    <text class="mono" font-size="12" y="186"><tspan x="32" class="k">role</tspan><tspan x="116" class="d">senior machine learning engineer II</tspan></text>
  </g>
  <g class="ln" style="animation-delay:1.40s">
    <text class="mono" font-size="12" y="204"><tspan x="32" class="k">education</tspan><tspan x="116" class="d">ms analytics + bs industrial engineering <tspan class="t">&#183;</tspan> usc</tspan></text>
  </g>

  <!-- $ agent status -->
  <g class="ln" style="animation-delay:1.65s">
    <text class="mono" font-size="12" y="232"><tspan x="32" class="ac">$</tspan><tspan x="48" class="d">jcb status</tspan></text>
  </g>
  <g class="ln" style="animation-delay:1.80s">
    <text class="mono" font-size="12" y="250"><tspan x="32" class="k">at work</tspan><tspan x="116" class="d">model training + serving <tspan class="t">&#183;</tspan> sdlc automation <tspan class="t">&#183;</tspan> agents for data + automation</tspan></text>
  </g>
  <g class="ln" style="animation-delay:1.95s">
    <text class="mono" font-size="12" y="268"><tspan x="32" class="k">own time</tspan><tspan x="116" class="d">notebook server in rust</tspan></text>
  </g>

  <line x1="32" y1="282" x2="798" y2="282" stroke="#30404d" stroke-width="1"/>

  <!-- commit + agent: 800617a is the real git blob hash of the claim line -->
  <g class="ln" style="animation-delay:2.20s">
    <text class="mono" font-size="12" y="302"><tspan x="32" class="k">commit</tspan><tspan x="116" class="ok">800617a</tspan></text>
    <text class="mono" font-size="14" font-weight="600" y="302"><tspan x="192" class="d">"i build the ml &amp; ai stack end to end"</tspan></text>
  </g>
  <g class="ln" style="animation-delay:2.40s">
    <text class="mono" font-size="12" y="320"><tspan x="32" class="k">agent</tspan><tspan x="116" class="ac">jacob.beaudin</tspan></text>
  </g>

  <!-- tmux-style status bar -->
  <rect x="0.5" y="326" width="829" height="23.5" fill="#192530"/>
  <path d="M0.5 326 H829.5 V339 A10 10 0 0 1 819.5 349.5 H10.5 A10 10 0 0 1 0.5 339 Z" fill="#192530"/>
  <text class="mono ok" font-size="11" x="24" y="341">[jacob@prod]</text>
  <text class="mono t" font-size="11" x="128" y="341">0:stack<tspan class="ok">*</tspan></text>
  <text class="mono t" font-size="11" y="341" text-anchor="end"><tspan x="806">uptime 8y</tspan></text>

  <rect x="0.5" y="0.5" width="829" height="349" rx="10" fill="none" stroke="#415564"/>
</svg>
